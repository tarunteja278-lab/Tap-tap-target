<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap the Target</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07142f, #32105f);
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 40px;
      margin: 10px 0;
    }

    .subtitle {
      color: #ddd;
      margin-bottom: 25px;
    }

    .stats {
      max-width: 800px;
      margin: auto;
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,0.08);
      border: 2px solid #2389ff;
      border-radius: 20px;
      padding: 15px;
    }

    .stat {
      font-size: 18px;
    }

    .number {
      display: block;
      font-size: 30px;
      font-weight: bold;
      margin-top: 5px;
    }

    #gameArea {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 450px;
      margin: 25px auto;
      border: 3px solid #168cff;
      border-radius: 20px;
      background: rgba(10, 30, 70, 0.8);
      overflow: hidden;
    }

    #target {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 5px solid white;
      background: radial-gradient(
        circle,
        white 0 18%,
        red 19% 40%,
        white 41% 60%,
        red 61% 100%
      );
      cursor: pointer;
      box-shadow: 0 0 20px red;
      display: none;
      transition: left 0.15s, top 0.15s;
    }

    #startButton {
      padding: 15px 60px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #32e875, #168cff);
      color: white;
      cursor: pointer;
    }

    #startButton:active {
      transform: scale(0.95);
    }

    .instructions {
      max-width: 700px;
      margin: 25px auto;
      padding: 18px;
      border: 2px solid #315fa0;
      border-radius: 15px;
      background: rgba(255,255,255,0.05);
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <h1>🎯 Tap the Target</h1>
  <p class="subtitle">Tap the target as fast as you can!</p>

  <div class="stats">
    <div class="stat">
      🏆 Score
      <span class="number" id="score">0</span>
    </div>

    <div class="stat">
      ⏱️ Time
      <span class="number" id="time">30</span>
    </div>

    <div class="stat">
      👑 Best
      <span class="number" id="best">0</span>
    </div>
  </div>

  <div id="gameArea">
    <button id="target">🎯</button>
  </div>

  <button id="startButton">▶ Start Game</button>

  <div class="instructions">
    <h3>💡 How to Play</h3>
    <p>1️⃣ Tap the target</p>
    <p>2️⃣ Earn points</p>
    <p>3️⃣ Beat the 30-second timer!</p>
  </div>

  <script src="script.js"></script>

</body>
</html>
